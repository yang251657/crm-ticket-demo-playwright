name: CRM Playwright Tests

on:
  push:
    branches:
      - main
      - master

  pull_request:
    branches:
      - main
      - master

  workflow_dispatch:

  repository_dispatch:
    types:
      - backend-deployed

jobs:
  # 测试代码本身发生变化时，验证 Playwright 项目是否正常
  test-project-ci:
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Run Playwright project tests
        run: |
          pytest tests \
            --browser chromium \
            --tracing retain-on-failure \
            --screenshot only-on-failure \
            --alluredir=allure-results \
            -v

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-ci-allure-results
          path: allure-results/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Playwright results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: project-ci-playwright-results
          path: test-results/
          if-no-files-found: warn
          retention-days: 7

  # 后端构建完成后，先自动运行少量 Smoke Tests
  smoke-tests:
    if: github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Run Smoke Tests
        run: |
          pytest tests/test_login.py \
            --browser chromium \
            --tracing retain-on-failure \
            --screenshot only-on-failure \
            --alluredir=smoke-allure-results \
            -v

      - name: Upload Smoke Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-allure-results
          path: smoke-allure-results/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Smoke Playwright results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-playwright-results
          path: test-results/
          if-no-files-found: warn
          retention-days: 7

  # Smoke 通过后，等待 QA 手工测试完成并审批
  qa-approval:
    if: github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch'
    needs: smoke-tests
    runs-on: ubuntu-latest

    environment:
      name: qa-testing-complete

    steps:
      - name: QA approval received
        run: |
          echo "QA manual testing has been completed and approved."

  # QA 点击 Approve 后，执行完整 UI Regression
  ui-regression:
    if: github.event_name == 'repository_dispatch' || github.event_name == 'workflow_dispatch'
    needs: qa-approval
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Chromium
        run: |
          python -m playwright install --with-deps chromium

      - name: Run UI Regression Tests
        run: |
          pytest tests \
            --browser chromium \
            --tracing retain-on-failure \
            --screenshot only-on-failure \
            --alluredir=regression-allure-results \
            -v

      - name: Upload Regression Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-allure-results
          path: regression-allure-results/
          if-no-files-found: warn
          retention-days: 7

      - name: Upload Regression Playwright results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-playwright-results
          path: test-results/
          if-no-files-found: warn
          retention-days: 7